name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Pipeline Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Pipeline Smoke Test
        run: |
          python run_pipeline.py --n-train 1000 --n-test 300 --n-estimators 50 --target-fpr 0.04

      - name: Upload Analytical Figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-figures
          path: reports/figures/

